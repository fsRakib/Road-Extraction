[project]
name = "road-extraction"
version = "0.1.0"
description = "Road extraction from satellite imagery for OSM tracing"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pillow",
    "numpy",
    "scipy",
    "scikit-image",
    "shapely",
    "pyproj",
    "rasterio",
]

# uv sync --extra validate    -> scoring against the .osm.pbf
# uv sync --extra deep        -> PyTorch models
[project.optional-dependencies]
validate = ["geopandas", "pyrosm"]
deep = ["torch", "torchvision", "segmentation-models-pytorch"]

[tool.uv]
package = false

# This laptop has no NVIDIA GPU, so pull the CPU-only torch wheel
# (~200 MB instead of ~2.5 GB for the CUDA build).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
